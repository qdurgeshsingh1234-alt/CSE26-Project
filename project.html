<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <br>
    <img src="logo.jpg" class="logo" alt="NGO Logo">
    <h1>NGO Management System</h1>
    <hr>
    <h3>Dashboard</h3>
    <p id="date"></p>
    <div class="dashboard-grid">
        <a href="profile.html" class="card">
            <img src="volunteer-bg.webp" alt="Volunteers">
            <span>View Volunteers</span>
        </a>
        <a href="manage.html" class="card">
            <img src="campaign-bg.jpg" alt="Campaigns">
            <span>Manage Campaigns</span>
        </a>
        <a href="assign.html" class="card">
            <img src="roles-bg.png" alt="Roles">
            <span>Assign Roles</span>
        </a>
        <a href="available.html" class="card">
            <img src="available-bg.jpg" alt="Available">
            <span>Available Campaigns</span>
        </a>
        <a href="shift.html" class="card">
            <img src="schedule-bg.jpg" alt="Schedule">
            <span>Shift Scheduling</span>
        </a>
        <a href="dashboard.html" class="card">
            <img src="dashboard-bg.jpg" alt="Dashboard">
            <span>Campaign Dashboard</span>
        </a>
    </div>
    <script src="script.js"></script>
</body>
</html>
